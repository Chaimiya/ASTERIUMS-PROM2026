<script>

(() => {
if (window.MagAperture) return;
window.MagAperture = function (root, slides) {
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const n = slides.length, AUTO = RM ? 0 : 6000, DUR = 1100;
  const $ = s => root.querySelector(s);
  const stack = $('.ap-stack'), ring = $('.ap-ring'), lens = $('.ap-lens'), count = $('.ap-count'), fill = $('.ap-fill'), live = $('.ap-live');
  const page = root.closest('.pg');
  const pad = v => (v < 10 ? '0' : '') + v;
  const wrap = i => ((i % n) + n) % n;
  const reach = (x, y, w, h) => Math.hypot(Math.max(x, w - x), Math.max(y, h - y));
  /* la página cuenta como visible solo si es lo que se ve en ese punto de la pantalla (no tapada por otras hojas) */
  const shown = () => {
    if (document.hidden) return false;
    const r = root.getBoundingClientRect(); if (r.width < 2 || r.height < 2) return false;
    const x = Math.min(innerWidth - 1, Math.max(0, r.left + r.width / 2)), y = Math.min(innerHeight - 1, Math.max(0, r.top + r.height * 0.4));
    const el = document.elementFromPoint(x, y); return !!el && !!page && page.contains(el);
  };
  let index = 0, busy = false, cur = null, down = null, side = 'Sig.';
  const kk = () => (root.getBoundingClientRect().width / root.offsetWidth) || 1;
  function mk(i) {
    const s = slides[i], d = document.createElement('div'); d.className = 'ap-layer';
    const a = s.w / s.h;
    d.dataset.fit = s.v || (a >= 0.6 && a <= 0.95) ? 'cover' : 'contain';
    if (s.v) {
      const v = document.createElement('video'); v.className = 'ap-img'; v.src = s.src; v.poster = s.poster || '';
      v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto'; v.setAttribute('aria-label', s.alt); d.append(v);
    } else {
      const b = new Image(); b.className = 'ap-bg'; b.alt = ''; b.src = s.src; b.draggable = false; b.setAttribute('aria-hidden', 'true');
      const m = new Image(); m.className = 'ap-img'; m.alt = s.alt; m.src = s.src; m.draggable = false; m.decoding = 'async';
      if (s.pos) m.style.objectPosition = s.pos;
      d.append(b, m);
    }
    return d;
  }
  const vid = (layer, on) => { const v = layer && layer.querySelector('video'); if (!v) return; if (on) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } else v.pause(); };
  const ui = () => { count.textContent = pad(index + 1) + ' — ' + pad(n); live.textContent = 'Foto ' + (index + 1) + ' de ' + n; };
  function run() { fill.dataset.run = '0'; if (AUTO > 0 && n > 1) { void fill.offsetWidth; fill.dataset.run = '1'; } }
  function warm(i) { const s = slides[i]; if (s && !s.v) { const im = new Image(); im.src = s.src; } }
  function go(dir, x, y) {
    if (busy || n < 2) return;
    busy = true;
    const w = root.offsetWidth, h = root.offsetHeight, to = wrap(index + dir);
    if (x == null) x = dir > 0 ? w * 0.85 : w * 0.15;
    if (y == null) y = h * 0.5;
    const nl = mk(to); nl.style.clipPath = RM ? 'none' : 'circle(0px at ' + x + 'px ' + y + 'px)';
    stack.append(nl); vid(nl, shown());
    fill.dataset.run = '0';
    const R = reach(x, y, w, h), at = ' at ' + x + 'px ' + y + 'px)', ease = 'cubic-bezier(.7,0,.2,1)', anims = [];
    if (RM) anims.push(nl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: 'both' }));
    else {
      anims.push(nl.animate([{ clipPath: 'circle(0px' + at }, { clipPath: 'circle(' + R + 'px' + at }], { duration: DUR, easing: ease, fill: 'both' }));
      const im = nl.querySelector('.ap-img');
      anims.push(im.animate([{ transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: DUR * 1.25, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' }));
      ring.style.width = ring.style.height = R * 2 + 'px';
      const t0 = 'translate(' + (x - R) + 'px,' + (y - R) + 'px) ';
      anims.push(ring.animate([{ transform: t0 + 'scale(0)', opacity: 1 }, { opacity: 1, offset: 0.7 }, { transform: t0 + 'scale(1)', opacity: 0 }], { duration: DUR, easing: ease, fill: 'both' }));
    }
    index = to; ui();
    anims[0].onfinish = () => {
      const old = cur; nl.style.clipPath = 'none';
      anims.forEach(a => a.cancel());
      if (old) { vid(old, false); old.remove(); }
      cur = nl; busy = false; run(); warm(wrap(index + 1));
    };
  }
  const local = e => { const r = root.getBoundingClientRect(), k = r.width / root.offsetWidth || 1; return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k, w: root.offsetWidth, k }; };
  root.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    const p = local(e); lens.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
    const t = p.x >= p.w / 2 ? 'Sig.' : 'Ant.'; if (t !== side) { side = t; lens.textContent = t; }
    lens.dataset.on = '1';
  });
  root.addEventListener('pointerleave', () => { lens.dataset.on = '0'; });
  /* el carrusel se queda con el gesto; las esquinas de abajo siguen pasando la página */
  root.addEventListener('pointerdown', e => { if (!e.isPrimary || e.button !== 0) return; e.stopPropagation(); down = { x: e.clientX, y: e.clientY }; });
  root.addEventListener('pointercancel', () => { down = null; });
  root.addEventListener('pointerup', e => {
    const s = down; down = null; if (!s) return;
    const p = local(e), dx = (e.clientX - s.x) / p.k, dy = (e.clientY - s.y) / p.k;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1, p.x, p.y);
    else if (Math.abs(dx) < 8 && Math.abs(dy) < 8) go(p.x >= p.w / 2 ? 1 : -1, p.x, p.y);
  });
  root.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); else return;
    e.preventDefault(); e.stopPropagation();
  });
  fill.addEventListener('animationend', () => go(1));
  /* se detiene cuando la página no se ve o la pestaña está en segundo plano */
  setInterval(() => { const on = shown(); root.dataset.paused = on ? '0' : '1'; vid(cur, on); }, 300);
  cur = mk(0); stack.append(cur); ui(); run(); warm(1);
  return { go };
};
})();

(() => {
  const P = document.getElementById('sec-gira-pedagogica-2');

  window.MagAperture(P.querySelector('.ap-root'), JSON.parse(P.querySelector('.ap-data').textContent));
})();
</script>
